<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slate Home</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f5f1;
      color: #242421;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #f7f5f1;
    }

    main {
      width: min(760px, calc(100vw - 48px));
      padding: 42px 0;
      text-align: center;
    }

    .brand-mark {
      display: block;
      width: 88px;
      height: 88px;
      margin: 0 auto 18px;
      object-fit: contain;
    }

    h1 {
      margin: 0 0 26px;
      font-size: 30px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      text-align: left;
    }

    .metric {
      min-width: 0;
      padding: 15px;
      border: 1px solid #dedbd5;
      border-radius: 8px;
      background: #fffefa;
    }

    .metric span {
      display: block;
      color: #696966;
      font-size: 13px;
    }

    .metric strong {
      display: block;
      margin-top: 7px;
      overflow: hidden;
      color: #242421;
      font-size: 17px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 620px) {
      body {
        place-items: start center;
      }

      main {
        padding-top: 34px;
      }

      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <img class="brand-mark" src="resource:///branding/slate-logo-cutout-256.png" alt="" aria-hidden="true">
    <h1>Slate</h1>
    <div class="summary">
      <div class="metric">
        <span>Broadweb</span>
        <strong>HTTPS, IPFS, Tor, I2P</strong>
      </div>
      <div class="metric">
        <span>Profile</span>
        <strong>Local state</strong>
      </div>
      <div class="metric">
        <span>Policy</span>
        <strong>Explicit routing</strong>
      </div>
    </div>
  </main>
</body>
</html>
