<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slate Settings</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f5f1;
      color: #242421;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f5f1;
    }

    main {
      box-sizing: border-box;
      width: min(760px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 48px 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: 650;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #696966;
      line-height: 1.45;
    }

    section {
      margin-top: 30px;
      padding: 24px;
      border: 1px solid #dedbd5;
      border-radius: 8px;
      background: #fffefa;
    }

    label {
      display: block;
      font-size: 16px;
      font-weight: 600;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      margin-top: 18px;
    }

    .slider {
      position: relative;
      height: 34px;
      cursor: pointer;
      touch-action: none;
      user-select: none;
    }

    .slider-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 6px;
      transform: translateY(-50%);
      border-radius: 999px;
      background: #dedbd5;
    }

    .slider-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #0b7e79;
    }

    .slider-thumb {
      position: absolute;
      left: 0;
      top: 50%;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      border: 2px solid #0b7e79;
      border-radius: 50%;
      background: #fffefa;
      box-shadow: 0 2px 8px rgba(24, 24, 20, 0.14);
    }

    .slider:focus-visible .slider-thumb {
      outline: 3px solid rgba(11, 126, 121, 0.22);
      outline-offset: 3px;
    }

    output {
      min-width: 52px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #393a37;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      border: 1px solid #c8c5bd;
      border-radius: 6px;
      background: #f3f0ea;
      color: #242421;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }

    button.primary {
      border-color: #0b7e79;
      background: #0b7e79;
      color: #fffefa;
    }
  </style>
</head>
<body>
  <main>
    <h1>Settings</h1>
    <p>Adjust browser chrome density. This affects Slate-owned toolbar, address, and side rail controls.</p>

    <section>
      <label id="chrome-zoom-label" for="chrome-zoom">Chrome element zoom</label>
      <div class="control-row">
        <div
          id="chrome-zoom"
          class="slider"
          role="slider"
          tabindex="0"
          aria-labelledby="chrome-zoom-label"
          aria-valuemin="75"
          aria-valuemax="115"
          aria-valuenow="90"
        >
          <div class="slider-track">
            <div id="chrome-zoom-fill" class="slider-fill"></div>
          </div>
          <div id="chrome-zoom-thumb" class="slider-thumb"></div>
        </div>
        <output id="chrome-zoom-output" for="chrome-zoom">90%</output>
      </div>
      <div class="actions">
        <button id="save" class="primary">Save</button>
        <button id="reset">Reset</button>
      </div>
    </section>
  </main>

  <script>
    const MIN_ZOOM = 75;
    const MAX_ZOOM = 115;
    const DEFAULT_ZOOM = 90;
    const slider = document.getElementById("chrome-zoom");
    const fill = document.getElementById("chrome-zoom-fill");
    const thumb = document.getElementById("chrome-zoom-thumb");
    const output = document.getElementById("chrome-zoom-output");
    const saveButton = document.getElementById("save");
    const params = new URLSearchParams(window.location.search);
    const initial = Number.parseFloat(params.get("chrome_zoom"));
    const fallbackImage = new Image();
    let sliderValue = DEFAULT_ZOOM;
    let lastPreviewZoom = "";
    let dragging = false;

    function clampPercent(value) {
      if (!Number.isFinite(value)) {
        return DEFAULT_ZOOM;
      }
      return Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, Math.round(value)));
    }

    function zoomString(percent) {
      return (percent / 100).toFixed(2);
    }

    function updateSlider() {
      sliderValue = clampPercent(sliderValue);
      const fraction = (sliderValue - MIN_ZOOM) / (MAX_ZOOM - MIN_ZOOM);
      const position = `${fraction * 100}%`;
      fill.style.width = position;
      thumb.style.left = position;
      output.value = `${sliderValue}%`;
      output.textContent = `${sliderValue}%`;
      slider.setAttribute("aria-valuenow", String(sliderValue));
      slider.setAttribute("aria-valuetext", `${sliderValue}%`);
    }

    function settingUrl(path, percent) {
      return `slate://settings/${path}?chrome_zoom=${zoomString(percent)}&nonce=${Date.now()}`;
    }

    function sendSetting(path, percent) {
      const url = settingUrl(path, percent);
      try {
        if (window.fetch) {
          const request = window.fetch(url, { cache: "no-store" });
          if (request && request.catch) {
            request.catch(() => {
              fallbackImage.src = url;
            });
          }
          return;
        }
      } catch (error) {}
      fallbackImage.src = url;
    }

    function previewZoom() {
      const zoom = zoomString(sliderValue);
      if (zoom === lastPreviewZoom) {
        return;
      }
      lastPreviewZoom = zoom;
      sendSetting("preview", sliderValue);
      saveButton.textContent = "Save";
    }

    function setSliderValue(percent, preview) {
      sliderValue = clampPercent(percent);
      updateSlider();
      if (preview) {
        previewZoom();
      }
    }

    function clientXFromEvent(event) {
      if (event.touches && event.touches.length > 0) {
        return event.touches[0].clientX;
      }
      if (event.changedTouches && event.changedTouches.length > 0) {
        return event.changedTouches[0].clientX;
      }
      return event.clientX;
    }

    function valueFromPointer(event) {
      const rect = slider.getBoundingClientRect();
      const width = Math.max(1, rect.width);
      const fraction = (clientXFromEvent(event) - rect.left) / width;
      return MIN_ZOOM + Math.min(1, Math.max(0, fraction)) * (MAX_ZOOM - MIN_ZOOM);
    }

    function updateFromPointer(event) {
      setSliderValue(valueFromPointer(event), true);
      if (event.cancelable) {
        event.preventDefault();
      }
    }

    function startDrag(event) {
      dragging = true;
      slider.focus();
      updateFromPointer(event);
    }

    function moveDrag(event) {
      if (dragging) {
        updateFromPointer(event);
      }
    }

    function stopDrag(event) {
      if (dragging) {
        updateFromPointer(event);
        dragging = false;
      }
    }

    function stepSlider(event) {
      let next = sliderValue;
      if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
        next -= 1;
      } else if (event.key === "ArrowRight" || event.key === "ArrowUp") {
        next += 1;
      } else if (event.key === "PageDown") {
        next -= 5;
      } else if (event.key === "PageUp") {
        next += 5;
      } else if (event.key === "Home") {
        next = MIN_ZOOM;
      } else if (event.key === "End") {
        next = MAX_ZOOM;
      } else {
        return;
      }

      event.preventDefault();
      setSliderValue(next, true);
    }

    function loadNativeZoom() {
      if (Number.isFinite(initial)) {
        setSliderValue(Math.round(initial * 100), true);
        return;
      }

      if (!window.fetch) {
        updateSlider();
        return;
      }

      window.fetch(`slate://settings/state?nonce=${Date.now()}`, { cache: "no-store" })
        .then((response) => response.json())
        .then((settings) => {
          const zoom = Number.parseFloat(settings.chrome_zoom);
          setSliderValue(Number.isFinite(zoom) ? Math.round(zoom * 100) : DEFAULT_ZOOM, false);
        })
        .catch(() => {
          updateSlider();
        });
    }

    slider.addEventListener("mousedown", startDrag);
    window.addEventListener("mousemove", moveDrag);
    window.addEventListener("mouseup", stopDrag);
    slider.addEventListener("touchstart", startDrag);
    window.addEventListener("touchmove", moveDrag);
    window.addEventListener("touchend", stopDrag);
    window.addEventListener("touchcancel", () => {
      dragging = false;
    });
    slider.addEventListener("keydown", stepSlider);
    saveButton.addEventListener("click", () => {
      sendSetting("save", sliderValue);
      saveButton.textContent = "Saved";
    });
    document.getElementById("reset").addEventListener("click", () => {
      setSliderValue(DEFAULT_ZOOM, true);
    });
    updateSlider();
    loadNativeZoom();
  </script>
</body>
</html>
