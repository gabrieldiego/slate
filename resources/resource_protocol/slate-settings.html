<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slate Settings</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f5f1;
      color: #242421;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f5f1;
    }

    main {
      box-sizing: border-box;
      width: min(760px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 48px 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: 650;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #696966;
      line-height: 1.45;
    }

    section {
      margin-top: 30px;
      padding: 24px;
      border: 1px solid #dedbd5;
      border-radius: 8px;
      background: #fffefa;
    }

    label {
      display: block;
      font-size: 16px;
      font-weight: 600;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      margin-top: 18px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #0b7e79;
    }

    output {
      min-width: 52px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #393a37;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      border: 1px solid #c8c5bd;
      border-radius: 6px;
      background: #f3f0ea;
      color: #242421;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }

    button.primary {
      border-color: #0b7e79;
      background: #0b7e79;
      color: #fffefa;
    }
  </style>
</head>
<body>
  <main>
    <h1>Settings</h1>
    <p>Adjust browser chrome density. This affects Slate-owned toolbar, address, and side rail controls.</p>

    <section>
      <label for="chrome-zoom">Chrome element zoom</label>
      <div class="control-row">
        <input id="chrome-zoom" type="range" min="75" max="115" step="1" value="90">
        <output id="chrome-zoom-output" for="chrome-zoom">90%</output>
      </div>
      <div class="actions">
        <button id="reset">Reset</button>
      </div>
    </section>
  </main>

  <script>
    const DEFAULT_ZOOM = 90;
    const slider = document.getElementById("chrome-zoom");
    const output = document.getElementById("chrome-zoom-output");
    const params = new URLSearchParams(window.location.search);
    const initial = Number.parseFloat(params.get("chrome_zoom"));
    const fallbackImage = new Image();
    let lastSentZoom = "";
    let livePollId = 0;

    if (Number.isFinite(initial)) {
      slider.value = String(Math.round(initial * 100));
    }

    function updateOutput() {
      output.value = `${slider.value}%`;
      output.textContent = `${slider.value}%`;
    }

    function settingUrl(path, zoom) {
      return `slate://settings/${path}?chrome_zoom=${zoom}&nonce=${Date.now()}`;
    }

    function replaceDisplayedUrl(zoom) {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, "", `slate://settings?chrome_zoom=${zoom}`);
      }
    }

    function sendZoom(percent) {
      const zoom = (percent / 100).toFixed(2);
      if (zoom === lastSentZoom) {
        return;
      }

      lastSentZoom = zoom;
      replaceDisplayedUrl(zoom);

      const url = settingUrl("apply", zoom);
      if (window.fetch) {
        window.fetch(url, { cache: "no-store" }).catch(() => {
          fallbackImage.src = url;
        });
      } else {
        fallbackImage.src = url;
      }
    }

    function applySliderZoom() {
      updateOutput();
      sendZoom(Number.parseInt(slider.value, 10));
    }

    function loadNativeZoom() {
      if (Number.isFinite(initial) || !window.fetch) {
        applySliderZoom();
        return;
      }

      window.fetch(`slate://settings/state?nonce=${Date.now()}`, { cache: "no-store" })
        .then((response) => response.json())
        .then((settings) => {
          const zoom = Number.parseFloat(settings.chrome_zoom);
          if (Number.isFinite(zoom)) {
            slider.value = String(Math.round(zoom * 100));
          }
          applySliderZoom();
        })
        .catch(applySliderZoom);
    }

    function startLivePoll() {
      applySliderZoom();
      if (livePollId === 0) {
        livePollId = window.setInterval(applySliderZoom, 50);
      }
    }

    function stopLivePoll() {
      if (livePollId !== 0) {
        window.clearInterval(livePollId);
        livePollId = 0;
      }
      applySliderZoom();
    }

    slider.addEventListener("input", applySliderZoom);
    slider.addEventListener("change", applySliderZoom);
    slider.addEventListener("keydown", applySliderZoom);
    slider.addEventListener("keyup", applySliderZoom);
    slider.addEventListener("mousedown", startLivePoll);
    slider.addEventListener("touchstart", startLivePoll);
    slider.addEventListener("pointerdown", startLivePoll);
    window.addEventListener("mouseup", stopLivePoll);
    window.addEventListener("touchend", stopLivePoll);
    window.addEventListener("touchcancel", stopLivePoll);
    window.addEventListener("pointerup", stopLivePoll);
    window.addEventListener("pointercancel", stopLivePoll);
    document.getElementById("reset").addEventListener("click", () => {
      slider.value = String(DEFAULT_ZOOM);
      applySliderZoom();
    });
    updateOutput();
    loadNativeZoom();
  </script>
</body>
</html>
