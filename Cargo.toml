[workspace]
members = [
    "crates/apps",
    "crates/browser-core",
    "crates/broadwebd",
    "crates/chrome",
    "crates/net",
    "crates/platform",
    "crates/profile-sync",
    "crates/privacy",
    "crates/protocols",
    "crates/rendering",
    "crates/routing",
    "crates/slate",
    "crates/storage",
    "xtask",
]
exclude = ["third_party/servo"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-or-later"
repository = "https://github.com/gabrieldiego/slate"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
base64 = "0.23.1"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
servo = { path = "third_party/servo/components/servo" }
dpi = "0.1"
headers = "0.4"
dirs = "6.0"
rusqlite = { version = "0.38", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
url = "2.5"
slate-apps = { path = "crates/apps" }
slate-browser-core = { path = "crates/browser-core" }
slate-broadwebd = { path = "crates/broadwebd" }
slate-chrome = { path = "crates/chrome" }
slate-net = { path = "crates/net" }
slate-platform = { path = "crates/platform" }
slate-profile-sync = { path = "crates/profile-sync" }
slate-privacy = { path = "crates/privacy" }
slate-protocols = { path = "crates/protocols" }
slate-rendering = { path = "crates/rendering" }
slate-routing = { path = "crates/routing" }
slate-storage = { path = "crates/storage" }

[patch.crates-io]
# WebRender 0.70.0 uses a const pattern for RenderTaskId::INVALID that current
# Rust rejects. Keep this local patch narrow until Servo/WebRender publishes a
# compatible dependency.
webrender = { path = "vendor/webrender-0.70.0" }

[profile.dev]
# Servo and SpiderMonkey produce very large debug artifacts. Keep line tables for
# useful local backtraces without forcing full DWARF into every default build.
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
