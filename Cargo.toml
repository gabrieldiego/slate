[workspace]
members = [
    "crates/apps",
    "crates/browser-core",
    "crates/chrome",
    "crates/net",
    "crates/platform",
    "crates/privacy",
    "crates/protocols",
    "crates/rendering",
    "crates/routing",
    "crates/slate",
    "crates/storage",
    "xtask",
]
exclude = ["third_party/servo"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/gabrieldiego/slate"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# minifb's Wayland backend does not expose true top-level movement, so the
# temporary framebuffer host uses X11/XWayland until Slate has native OS shims.
minifb = { version = "0.28", default-features = false, features = ["x11"] }
slate-apps = { path = "crates/apps" }
slate-browser-core = { path = "crates/browser-core" }
slate-chrome = { path = "crates/chrome" }
slate-net = { path = "crates/net" }
slate-platform = { path = "crates/platform" }
slate-privacy = { path = "crates/privacy" }
slate-protocols = { path = "crates/protocols" }
slate-rendering = { path = "crates/rendering" }
slate-routing = { path = "crates/routing" }
slate-storage = { path = "crates/storage" }
